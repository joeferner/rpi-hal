name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything `make pre-commit` runs locally, as separate steps rather than
  # one `pre-commit` invocation: the targets are identical either way, and
  # splitting them means a failure names itself in the job list instead of
  # having to be read out of a combined log.
  #
  # These use the toolchain `rust-toolchain.toml` pins (nightly, `rust-src`,
  # both bare-metal targets), because building the *examples* goes through
  # `.cargo/config.toml`'s `-Zbuild-std`. The library itself needs none of
  # that -- see the `msrv` job below, which is what proves it.
  check:
    name: fmt, clippy, build, examples, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Materializes the pinned toolchain along with the components and
      # targets the manifest asks for; no toolchain action needed, since
      # the pin is already in the repository.
      - name: Install the pinned toolchain
        run: |
          rustup show
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - run: make fmt-check
      - run: make clippy
      - run: make build-bcm2837
      - run: make build-bcm2711
      - run: make examples
      - run: make doc

  # Guards the `rust-version` claim in Cargo.toml. Without this the MSRV is
  # a comment that rots the first time a dependency or a `core` API moves.
  msrv:
    name: library builds on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install 1.88 with both bare-metal targets
        run: |
          rustup toolchain install 1.88 --profile minimal \
            --target armv7a-none-eabi \
            --target aarch64-unknown-none-softfloat

      # Run from outside the checkout, reaching back in with
      # `--manifest-path`. `.cargo/config.toml` is discovered from the
      # working directory, and its `[unstable] build-std` is nightly-only --
      # inside the repo, a stable toolchain refuses the whole invocation
      # before compiling anything. Standing outside is what makes this a
      # real test of the claim: rustup's precompiled `core`/`alloc` cover
      # both targets, so no `-Zbuild-std` is needed to build the library.
      #
      # Every feature except `smoltcp`, whose own manifest requires 1.91 --
      # cargo would reject the build naming smoltcp, which is exactly why
      # Cargo.toml leaves that floor to smoltcp rather than folding it in.
      - name: Build for both architectures
        working-directory: ${{ runner.temp }}
        run: |
          for target in armv7a-none-eabi aarch64-unknown-none-softfloat; do
            cargo +1.88 build --release \
              --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
              --target "$target" \
              --features bcm2837,multicore,async,embedded-sdmmc,v3d
          done

  # `cargo package` finishes by building the packaged tarball, which catches
  # a whole class of "works here, broken on crates.io" problems: a file the
  # manifest excludes but the build needs, or a path that only resolves in
  # this working copy.
  #
  # Deliberately uncached, unlike the job above. `cargo package` unpacks the
  # tarball into `target/package/rpi-hal-<version>/` and builds it there, and
  # the cache action's cleanup walks `target` expecting a normal layout --
  # it logs `ENOENT ... target/package/rpi-hal-0.1.0/tests/trybuild` errors
  # against a job that actually succeeded. Nothing to gain by keeping it: the
  # verify build is one small crate.
  package:
    name: package verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show
      - run: make package

  # Hardware-in-the-loop tests (`tests/hil/`) are deliberately absent: they
  # drive a real Pi and an STM32 fixture over serial, so no hosted runner can
  # run them. Every check above is a compile-time one, and passing CI says
  # nothing about whether a driver works on the hardware.
