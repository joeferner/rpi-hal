name: CI

# The one workflow GitHub triggers for checks. Each crate's own checks live
# in a reusable workflow beside this one (`_hal.yml`, `_embassy.yml`, ...);
# this file decides which of them a change needs, and `ci-ok` turns their
# results into the single status the branch ruleset requires.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, everything. rpi-hal pins a floating `nightly`, and the
  # crates.io dependencies move whether or not this repository does, so a
  # quiet week can still break the build.
  schedule:
    - cron: "17 6 * * *"

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `pull-requests: read` is what the change filter lists a PR's files with.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Which crates a pull request touches. A crate's checks run when it
  # changes *or anything it builds against does*: rpi-hal-embassy depends
  # on `hal/` by path, so a change to rpi-hal has to prove rpi-hal-embassy
  # still builds. The table mirrors the path dependencies in the manifests.
  #
  # Only pull requests are filtered. A push to main, the nightly run and a
  # manual dispatch run everything (see each job's `if:`), so main is
  # always checked as a whole.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      hal: ${{ steps.filter.outputs.hal }}
      embassy: ${{ steps.filter.outputs.embassy }}
      kickstart: ${{ steps.filter.outputs.kickstart }}
      loader: ${{ steps.filter.outputs.loader }}
      template: ${{ steps.filter.outputs.template }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # `shared` is what every crate's checks depend on: the workflows
          # themselves, the scripts they call, and the root Makefile.
          filters: |
            shared: &shared
              - '.github/**'
              - 'scripts/ci/**'
              - 'Makefile'
            hal:
              - *shared
              - 'hal/**'
            embassy:
              - *shared
              - 'hal/**'
              - 'embassy/**'
            kickstart:
              - *shared
              - 'hal/**'
              - 'embassy/**'
              - 'loader/ota/**'
              - 'kickstart/**'
            loader:
              - *shared
              - 'hal/**'
              - 'loader/**'
            # The crates a generated project reaches, for the advisory
            # build against this repository; and site/, whose generator is
            # diffed against cargo-generate's output.
            template:
              - *shared
              - 'template/**'
              - 'scripts/template/**'
              - 'site/**'
              - 'hal/**'
              - 'embassy/**'
              - 'kickstart/**'
              - 'loader/ota/**'
            # The site renders template/boards.json and serves the template.
            site:
              - *shared
              - 'site/**'
              - 'template/**'

  hal:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.hal == 'true'
    uses: ./.github/workflows/_hal.yml

  embassy:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.embassy == 'true'
    uses: ./.github/workflows/_embassy.yml

  kickstart:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.kickstart == 'true'
    uses: ./.github/workflows/_kickstart.yml

  loader:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.loader == 'true'
    uses: ./.github/workflows/_loader.yml

  template:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.template == 'true'
    uses: ./.github/workflows/_template.yml

  site:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/_site.yml

  # The only required status check. Requiring the crate jobs directly can't
  # work: a crate the change doesn't touch is skipped, and a skipped
  # required check never reports, so the pull request would wait forever.
  # This job always runs, and fails if anything it waited on failed or was
  # cancelled; skipped counts as a pass.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, hal, embassy, kickstart, loader, template, site]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
