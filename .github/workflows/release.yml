name: Release

# Publishing to crates.io is permanent -- a version can be yanked but never
# replaced or deleted -- so this never triggers on a branch push. Pushing a
# `v*` tag is the deliberate act that starts a release, and
# `workflow_dispatch` covers re-running it after a failure without moving the
# tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Creating the GitHub release object needs write access to the repository's
# contents; nothing here needs anything else. Without this the default token
# is read-only and `gh release create` fails with a 403 -- after `make
# package` has already run, so it costs the whole job to find out.
permissions:
  contents: write

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      # Both guards below fail the release rather than publishing something
      # that can't be taken back.
      #
      # The tag check lives inside the script rather than in an `if:` on the
      # step, because the step also publishes the version number every step
      # below reads. Skipping the step on a dispatch run would skip the
      # outputs with it, and the steps that consume them would run against an
      # empty string.
      - name: Tag must match the manifest version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # A dispatch run has no tag in its context, so the manifest is the
          # authority there and there is nothing to cross-check.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # `CHANGELOG.md`'s heading carries a literal `ReleaseDate` placeholder
      # (the `cargo-release` convention) until the release is actually dated.
      # Publishing with it still in place ships a changelog that says the
      # version was never released.
      #
      # The section also has to exist, and not only because an undescribed
      # release is unhelpful: it is what the release notes below are written
      # from, so without it the release page would be created empty.
      - name: Changelog must have a dated section for this version
        run: |
          version="${{ steps.version.outputs.version }}"
          if grep -q ReleaseDate CHANGELOG.md; then
            echo "CHANGELOG.md still has the ReleaseDate placeholder" >&2
            exit 1
          fi
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' section" >&2
            exit 1
          fi

      # A chip feature is not optional: the verification build inside
      # `package`/`publish` uses *default* features, which select no chip, so
      # `lib.rs`'s `compile_error!` fires and the publish aborts on a package
      # that is actually fine.
      - run: make package

      # Written to the runner's temp directory, not the checkout. This
      # package is the repository root, so a stray file here is a file
      # *inside* the package -- and `cargo publish` refuses to publish from a
      # working tree with uncommitted changes, which is exactly the guard we
      # want it to keep.
      #
      # The range has to end at the *next* `## [` heading. The obvious
      # `sed -n '/## \[<version>\]/,/^\[<version>\]:/p'` does not work: that
      # closing address matches the link reference at the bottom of the file
      # rather than anything near the section, so the range runs past every
      # older heading and the notes become the entire changelog. It fails
      # silently, so the only symptom is an over-long release page.
      - name: Extract this version's changelog section
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="## [$version]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      # Before the irreversible step, so a release whose notes cannot be
      # built fails while everything is still undoable. Idempotent, so a
      # re-run after a failed publish does not stall here -- and so that a
      # release object created by hand gets its notes corrected rather than
      # refusing the run.
      #
      # `CHANGELOG.md`'s version links point at `/releases/tag/v<version>`,
      # which only resolves once this object exists.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      # A re-run of an otherwise-successful release must not fail here just
      # because this half already happened; crates.io refuses a version that
      # exists, and that refusal would mask whatever the re-run was for. The
      # sparse index is the cheapest authority on the question.
      - name: Is this version already on crates.io?
        id: published
        run: |
          version="${{ steps.version.outputs.version }}"
          index="$(curl -sS https://index.crates.io/rp/i-/rpi-hal || true)"
          if printf '%s' "$index" | grep -q "\"vers\":\"$version\""; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "rpi-hal $version is already published; skipping"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --features bcm2837
