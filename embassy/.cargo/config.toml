# Both architectures are supported; AArch32 is the default only because it
# is the one a Pi 2 can run. Build the other with
# `--target aarch64-unknown-none-softfloat`.
[build]
target = "armv7a-none-eabi"

# The linker script for this crate's example images comes from `rpi-hal`,
# which publishes it on the linker search path as `rpi-link.x` -- so there's
# no copy of it here and no build script to pass one. It provides the
# `_start`/`__bss_start`/`__bss_end` that `rpi-hal`'s boot code links
# against, already at the right load address for the target being built
# (0x8000 for a 32-bit kernel7.img, 0x80000 for a 64-bit kernel8.img), which
# is why both entries below are the same line: the architecture is decided
# on `rpi-hal`'s side, not here.
#
# Note these are ignored outright if a `RUSTFLAGS` environment variable is
# set, and the symptom is `undefined symbol: __bss_end`.
[target.armv7a-none-eabi]
rustflags = ["-C", "link-arg=-Trpi-link.x"]

[target.aarch64-unknown-none-softfloat]
rustflags = ["-C", "link-arg=-Trpi-link.x"]

# ARMv6 (Pi 1, Pi Zero) loads at the same 0x8000 as the AArch32 target
# above and takes the same script, for the same reason -- `rpi-hal`'s
# build script picks which one by architecture. Unlike the other two,
# this target has no precompiled `core`, so its `make` recipes add
# `+nightly -Z build-std=core`; `build-std` is deliberately not set here,
# since a config-level `[unstable]` table is silently ignored on stable
# and would make the requirement invisible at the one place it applies.
[target.armv6-none-eabi]
rustflags = ["-C", "link-arg=-Trpi-link.x"]

# TEMPORARY: the embassy crates from an upstream commit, for the `usb-host`
# feature, until a release carries what it needs.
#
# The USB host stack this feature runs on is `embassy_usb::host`. Upstream
# moved it there from `embassy-usb-host` (now deprecated) after
# `embassy-usb` 0.6.0, and hasn't released it; the hub, enumeration and
# address fixes this board depends on (embassy-rs/embassy #6788 to #6791)
# are only in that code too. Released `embassy-usb-host` 0.1.0 can't even
# register the Pi's on-board LAN9514 hub, and every device on this board
# is behind it.
#
# Which crates move with it is decided by what must exist only once. A
# crate from the git repository depends on its siblings by path there, so
# patching `embassy-usb` alone gives it git siblings while this crate's
# own dependencies still come from crates.io. That's tolerable for most,
# but not for:
#
# - `embassy-usb-driver`: `src/usb.rs` implements its traits and the host
#   stack consumes them, so both sides need the same copy.
# - `embassy-time` and `embassy-time-driver`: the driver is a link-time
#   singleton (`links = "embassy-time"`), and cargo refuses a second copy.
# - `embassy-time-queue-utils` (`links = "embassy-time-queue"`), the
#   executor and its timer queue: the integrated timer queue lives in the
#   task header, so the executor and the queue must agree on one
#   `embassy-executor-timer-queue`.
# - `embassy-futures`, which is harmless doubled but simpler not to be.
#
# Deliberately *not* moved: `embassy-sync` and the network crates. Upstream
# has since replaced `embassy-net-driver` with `xarxa` and ported
# `embassy-net` and `embassy-net-driver-channel` to it, so moving those
# would mean porting the LAN9514 and Wi-Fi adapters to an unreleased
# network stack. `embassy-usb` from git gets its own copies of
# `embassy-sync` and `embassy-net-driver-channel` (for its CDC-NCM class)
# instead, which is fine as long as none of their types crosses between
# it and this crate, and none does.
#
# Upstream's versions at this commit are the published ones, so this
# changes source, not semver, and nothing in Cargo.toml has to move for
# the patched crates. Here rather than in Cargo.toml so it stays out of
# the published package.
# This is also why the branch carrying it can't merge: the published crate
# would require an `embassy-usb` with a `host` module that crates.io
# doesn't have. Delete the whole block once embassy releases it, and move
# `embassy-usb`'s requirement in Cargo.toml to that version.
[patch.crates-io]
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "2add3add84745a4aa0c9bac6b0ecb43a820d4b54" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "2add3add84745a4aa0c9bac6b0ecb43a820d4b54" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "2add3add84745a4aa0c9bac6b0ecb43a820d4b54" }
embassy-executor-macros = { git = "https://github.com/embassy-rs/embassy", rev = "2add3add84745a4aa0c9bac6b0ecb43a820d4b54" }
embassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy", rev = "2add3add84745a4aa0c9bac6b0ecb43a820d4b54" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "2add3add84745a4aa0c9bac6b0ecb43a820d4b54" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "2add3add84745a4aa0c9bac6b0ecb43a820d4b54" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "2add3add84745a4aa0c9bac6b0ecb43a820d4b54" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "2add3add84745a4aa0c9bac6b0ecb43a820d4b54" }

