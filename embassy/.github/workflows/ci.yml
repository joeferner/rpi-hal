name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything `make pre-commit` runs locally, as separate steps rather than
  # one `pre-commit` invocation: the targets are identical either way, and
  # splitting them means a failure names itself in the job list instead of
  # having to be read out of a combined log. `fmt-check` stands in for
  # `fmt`, which would rewrite files rather than report on them.
  check:
    name: fmt, clippy, build, examples, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Materializes the toolchain rust-toolchain.toml pins, along with the
      # components and both bare-metal targets it asks for.
      - name: Install the pinned toolchain
        run: |
          rustup show
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - run: make fmt-check
      - run: make clippy
      - run: make build
      - run: make examples
      - run: make doc

      # The examples are the only thing that links, and linking is where a
      # missing `rpi-link.x` or a stray RUSTFLAGS shows up. AArch64 is not
      # covered by the steps above, whose target comes from
      # .cargo/config.toml.
      #
      # `--all-features` on the second examples build for the same reason
      # `make examples` runs twice: an example whose `required-features` are
      # unmet is skipped silently, so without it the `multicore` one is
      # never compiled for this architecture.
      - name: Build for AArch64 as well
        run: |
          cargo build --release --target aarch64-unknown-none-softfloat
          cargo build --release --examples --target aarch64-unknown-none-softfloat
          cargo build --release --examples --all-features --target aarch64-unknown-none-softfloat

  # Guards the `rust-version` claim in Cargo.toml. Without this the MSRV is
  # a comment that rots the first time a dependency or a `core` API moves.
  msrv:
    name: builds on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the MSRV from the manifest
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version" || { echo "Cargo.toml has no rust-version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install that toolchain with both bare-metal targets
        run: |
          rustup toolchain install ${{ steps.msrv.outputs.version }} \
            --profile minimal \
            --target armv7a-none-eabi \
            --target aarch64-unknown-none-softfloat

      # The library only, for both architectures. The examples pull in
      # dev-dependencies (embassy-net, picoserve) whose own floors are
      # their business, not this crate's claim.
      - name: Build the library
        run: |
          for target in armv7a-none-eabi aarch64-unknown-none-softfloat; do
            cargo +${{ steps.msrv.outputs.version }} build --release --target "$target"
          done

  # `cargo package` finishes by building the packaged tarball, which catches
  # a whole class of "works here, broken on crates.io" problems: a file the
  # manifest excludes but the build needs, or a path that only resolves in
  # this working copy.
  #
  # Deliberately uncached: `cargo package` unpacks into target/package/ and
  # builds there, which the cache action's cleanup does not expect, and
  # there is nothing to gain for one small crate.
  package:
    name: package verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show
      - run: make package

  # Hardware-in-the-loop tests are deliberately absent: every check above is
  # a compile-time one. Whether a deadline actually fires, and whether the
  # core really idles in `wfe` between them, is established on a board.
