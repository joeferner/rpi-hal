name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything `make pre-commit` runs locally, as separate steps rather than
  # one `pre-commit` invocation: the targets are identical either way, and
  # splitting them means a failure names itself in the job list instead of
  # having to be read out of a combined log. `fmt-check` stands in for
  # `fmt`, which would rewrite files rather than report on them.
  check:
    name: fmt, clippy, build, examples, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Materializes the toolchain rust-toolchain.toml pins, along with the
      # components and both bare-metal targets it asks for.
      - name: Install the pinned toolchain
        run: |
          rustup show
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - run: make fmt-check
      - run: make clippy
      - run: make build
      - run: make examples
      - run: make doc

      # The ARMv6 (BCM2835) build, which is the one thing here that is not
      # on the pinned stable toolchain: `armv6-none-eabi` is tier 3, so
      # rustup publishes no `core` for it and `-Z build-std` has to compile
      # one, which needs nightly and `rust-src`. Installed here rather than
      # pinned in `rust-toolchain.toml`, so that everything above keeps
      # proving what it proves -- that this crate builds on stable.
      # `rust-src` is what `-Z build-std` compiles `core` from. `clippy` is
      # named because `--profile minimal` installs exactly what is listed
      # and nothing else: on a workstation the default profile happens to
      # include it, so `make clippy-armv6` passes locally and fails here
      # with "'cargo-clippy' is not installed for the toolchain 'nightly'".
      # Components are per-toolchain, so the pinned stable having clippy
      # says nothing about nightly.
      - name: Install nightly for the tier-3 ARMv6 target
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src \
            --component clippy

      - run: make clippy-armv6
      - run: make build-armv6
      - run: make examples-armv6

      # The examples are the only thing that links, and linking is where a
      # missing `rpi-link.x` or a stray RUSTFLAGS shows up. AArch64 is not
      # covered by the steps above, whose target comes from
      # .cargo/config.toml.
      #
      # Deliberately `make` rather than the `cargo` lines these used to be:
      # which features sweep the examples is a fact about this crate, and
      # the Makefile is where it lives. Written out here as well, the two
      # drifted the moment `irq-dispatch` arrived -- the Makefile dropped
      # `--all-features` for an explicit set, this step kept it, and the
      # build failed here on a duplicate `__irq_handler` after passing
      # locally.
      - name: Build for AArch64 as well
        run: |
          make build-aarch64
          make examples-aarch64

  # Guards the `rust-version` claim in Cargo.toml. Without this the MSRV is
  # a comment that rots the first time a dependency or a `core` API moves.
  msrv:
    name: builds on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the MSRV from the manifest
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version" || { echo "Cargo.toml has no rust-version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install that toolchain with both bare-metal targets
        run: |
          rustup toolchain install ${{ steps.msrv.outputs.version }} \
            --profile minimal \
            --target armv7a-none-eabi \
            --target aarch64-unknown-none-softfloat

      # The library only, for both architectures. The examples pull in
      # dev-dependencies (embassy-net, picoserve) whose own floors are
      # their business, not this crate's claim.
      - name: Build the library
        run: |
          for target in armv7a-none-eabi aarch64-unknown-none-softfloat; do
            cargo +${{ steps.msrv.outputs.version }} build --release --target "$target"
          done

  # `cargo package` finishes by building the packaged tarball, which catches
  # a whole class of "works here, broken on crates.io" problems: a file the
  # manifest excludes but the build needs, or a path that only resolves in
  # this working copy.
  #
  # Deliberately uncached: `cargo package` unpacks into target/package/ and
  # builds there, which the cache action's cleanup does not expect, and
  # there is nothing to gain for one small crate.
  package:
    name: package verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show
      - run: make package

  # Hardware-in-the-loop tests are deliberately absent: every check above is
  # a compile-time one. Whether a deadline actually fires, and whether the
  # core really idles in `wfe` between them, is established on a board.
