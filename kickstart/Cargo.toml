[package]
name = "rpi-kickstart"
version = "0.1.0"
edition = "2024"
description = "Application scaffolding for bare-metal Raspberry Pi boards: console, config, storage, web and the rest of the bring-up that is the same on every board, on top of rpi-hal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joeferner/rpi-kickstart"
documentation = "https://docs.rs/rpi-kickstart"
readme = "README.md"
keywords = ["raspberry-pi", "bare-metal", "no-std", "embedded", "bcm2837"]
categories = ["embedded", "no-std"]
# Edition 2024 puts the floor at 1.85 on its own; 1.88 is where `rpi-hal`
# and `rpi-hal-embassy` already sit, and this crate is only ever used with
# them, so nothing is gained by claiming a lower one.
rust-version = "1.88"

# docs.rs builds for a host target by default. Nothing here needs one yet,
# but the moment this crate depends on `rpi-hal` it will not compile for a
# host at all -- so the targets are named now rather than discovered on the
# first release that turns the published page into a build failure. Both
# architectures are listed because the crate supports both.
[package.metadata.docs.rs]
default-target = "armv7a-none-eabi"
targets = ["aarch64-unknown-none-softfloat"]
# Enumerated rather than `all-features = true`, because the chip features
# are not a set to turn all of: they forward to `rpi-hal`'s, where more
# than one resolves by precedence. Every module is listed, since a
# feature-gated one is otherwise absent from the published page entirely.
features = ["console", "entropy", "heap", "bcm2837"]

[dependencies]
# API only. The single implementation comes from `rpi-hal`'s `rt` feature,
# and it has to: a program links only if its crate graph contains exactly
# one, so a library naming an implementation takes the choice away from
# every consumer.
#
# Still the only edge here, and `console` is a fair test of how long that
# lasts -- the module it backs is the one every other module logs through,
# and it needs nothing from `rpi-hal` at all. See src/console.rs for why
# its sink is a trait object rather than a `Uart`.
critical-section = { version = "1.2.0", default-features = false, optional = true }

# The HAL, for `entropy`'s hardware RNG. `default-features = false` keeps
# `rt` and `mmu` out of what this crate imposes: the boot sequence and the
# MMU bring-up are the application's to choose, and cargo unions in
# whatever it selects.
#
# Deliberately no chip feature on this line. `rpi-hal`'s PAC selection has
# a precedence order -- `bcm2711` > `bcm2837` > `bcm2835` -- so a chip
# named here would be one a consumer could not turn off, and adding a
# lower-precedence chip alongside it selects the wrong peripheral base
# silently rather than failing. In practice an application's own `rpi-hal`
# line already names one and cargo unifies it; the forwarding features
# below exist for builds of *this* crate, which have no such line.
rpi-hal = { version = "0.7.0", default-features = false, optional = true }

# The randomness interface the RustCrypto primitives under `rustls` reach
# through. `custom` is the feature that lets a target with no OS supply
# its own backend, which is what src/entropy.rs registers.
#
# 0.2 rather than 0.3: that is what the crypto stack in this crate's
# consumers resolves to, and the two majors are different mechanisms --
# 0.3 replaced `register_custom_getrandom!` with a `--cfg` and a
# `no_mangle` symbol. Moving is a change to make when the stack above
# moves, not before.
getrandom = { version = "0.2", default-features = false, features = [
    "custom",
], optional = true }

# The allocator behind `heap`. `default-features = false` with `tlsf`
# named: the crate also ships a linked-list allocator, and which one is
# in the binary should be a line someone wrote rather than a default --
# see src/heap.rs for why this one.
embedded-alloc = { version = "0.6", default-features = false, features = [
    "tlsf",
], optional = true }

[dev-dependencies]
# The examples are whole programs: they boot on `rpi-hal`'s `rt` and talk
# to real peripherals, which the library itself does not yet do. Keeping
# this to a dev edge is what stops the examples' needs -- a boot sequence,
# a particular chip -- from becoming requirements this crate imposes on
# every consumer.
#
# `rt` and `mmu` arrive as `rpi-hal`'s defaults. `bcm2837` does not (none
# of its chip features are on by default) and has to be named: the PAC is
# what `Uart::init` reaches through. Pi 2/3 because that is what the
# examples are written for; a consumer selects its own chip and is not
# affected by this line.
rpi-hal = { version = "0.7.0", features = ["bcm2837"] }
# How an example hands the console a sink that outlives `kmain`'s stack,
# since `console::init` borrows for `'static`. Not a library dependency:
# which static-storage crate an application uses is its own choice, and
# this crate only ever receives the reference.
static_cell = "2.1.1"
# So the entropy example can call `getrandom` the way a crypto crate
# would, which is the half of that module a direct `fill` does not
# exercise: whether the registration actually resolved. The version must
# match the optional dependency above -- cargo requires one source per
# dependency across all build targets.
#
# `custom` has to be here as well, and not only for symmetry: without it
# `getrandom` has no backend for a bare-metal target and refuses to
# compile at all, which would break the feature-free `--examples` pass
# even though nothing in it calls the crate. Enabling the feature only
# defers the choice to a registered symbol -- it does not demand one
# until something actually calls `getrandom`, which no example does
# without `entropy`.
getrandom = { version = "0.2", default-features = false, features = [
    "custom",
] }

[features]
# Nothing is on by default, and that is the crate's whole arrangement: a
# board states what it is and pays for nothing else. `default` is written
# out as empty rather than omitted so that the absence is a decision on
# the page instead of something to be inferred from a missing key.
default = []

# The console sink and `logln!` (src/console.rs).
#
# The `critical-section` edge is what the feature actually buys: the sink
# is shared between tasks and interrupt handlers, so it is behind a mutex,
# and that mutex needs an implementation in the final binary. A board that
# never logs should not have to supply one.
console = ["dep:critical-section"]

# Hardware entropy and the `getrandom` backend (src/entropy.rs).
#
# Unlike `console`, this one needs a chip: it reaches `rpi_hal::rng`,
# whose register block sits at a `PERIPHERAL_BASE` offset, and `rpi-hal`
# rejects a build with no chip feature outright. A consumer's own
# `rpi-hal` line usually supplies it; one of the three below does
# otherwise.
entropy = ["dep:rpi-hal", "dep:getrandom", "dep:critical-section"]

# The `#[global_allocator]` and its sizing (src/heap.rs).
#
# Needs a chip for the same reason `entropy` does: the extent comes from
# `rpi_hal::mem::heap_region`, which asks the firmware through the
# mailbox.
#
# Like `entropy`, enabling this decides something for the whole binary
# rather than for the caller -- a program has exactly one allocator. Off
# by default so that taking that decision is explicit.
#
# `rpi-hal/rt` is the one place this crate asks for a boot sequence rather
# than leaving it to the application, and it is not a convenience.
# `rpi_hal::mem` lives behind that feature because the region's lower
# bound is `__bss_end`, a symbol only `rt`'s linker script defines -- so
# an image that could turn `rt` off is an image with no answer to where
# free memory starts. Any board linking against `rpi-link.x` already has
# it; this makes the requirement resolve rather than surface as a missing
# module.
heap = ["dep:rpi-hal", "rpi-hal/rt", "dep:embedded-alloc"]

# The chip, forwarded to `rpi-hal`'s feature of the same name. None is a
# default, so a board says which it is -- and says it once, since cargo
# unifies this with whatever its own `rpi-hal` line asks for.
#
# `rpi-hal?/` rather than `rpi-hal/`: the plain form would make naming a
# chip quietly *enable* the optional dependency, so a board using nothing
# but `console` would acquire a HAL it has no use for. With `?` these say
# "if `rpi-hal` is in the build, tell it which chip", which is all they
# are for.
#
# They are not mutually exclusive as cargo features -- nothing can make
# them be -- so turning on two resolves by `rpi-hal`'s precedence rather
# than failing. That is why nothing in this repository builds with
# `--all-features`; see the Makefile.
bcm2835 = ["rpi-hal?/bcm2835"]
bcm2837 = ["rpi-hal?/bcm2837"]
bcm2711 = ["rpi-hal?/bcm2711"]

# Auto-discovery covers `hello`, which needs no features. These need
# entries so they can declare `required-features` -- without one a plain
# `cargo build --examples` would fail on an example whose module is not
# compiled.
[[example]]
name = "console"
required-features = ["console"]

# The chip is named here as well as the feature, because an example is a
# whole image and has no application manifest above it to supply one.
[[example]]
name = "entropy"
# `console` as well, because this example reports through `logln!`. Every
# example from here on will want it for the same reason, which is a fair
# sign of what a real board's feature list looks like.
required-features = ["entropy", "console", "bcm2837"]

[[example]]
name = "heap"
required-features = ["heap", "console", "bcm2837"]

# A fault on a bare-metal target has nowhere to unwind to -- there is no
# runtime to catch a panic and no thread to kill -- and the unwinding
# tables cost image size for a path that can never be taken. `abort` in
# both profiles so a debug build fails the same way a release one does.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
