[package]
name = "rpi-kickstart"
version = "0.1.0"
edition = "2024"
description = "Application scaffolding for bare-metal Raspberry Pi boards: console, config, storage, web and the rest of the bring-up that is the same on every board, on top of rpi-hal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joeferner/rpi-kickstart"
documentation = "https://docs.rs/rpi-kickstart"
readme = "README.md"
keywords = ["raspberry-pi", "bare-metal", "no-std", "embedded", "bcm2837"]
categories = ["embedded", "no-std"]
# Edition 2024 puts the floor at 1.85 on its own; 1.88 is where `rpi-hal`
# and `rpi-hal-embassy` already sit, and this crate is only ever used with
# them, so nothing is gained by claiming a lower one.
rust-version = "1.88"

# docs.rs builds for a host target by default. Nothing here needs one yet,
# but the moment this crate depends on `rpi-hal` it will not compile for a
# host at all -- so the targets are named now rather than discovered on the
# first release that turns the published page into a build failure. Both
# architectures are listed because the crate supports both.
[package.metadata.docs.rs]
default-target = "armv7a-none-eabi"
targets = ["aarch64-unknown-none-softfloat"]
# Enumerated rather than `all-features = true`, because the chip features
# are not a set to turn all of: they forward to `rpi-hal`'s, where more
# than one resolves by precedence. Every module is listed, since a
# feature-gated one is otherwise absent from the published page entirely.
features = ["console", "entropy", "heap", "config", "storage", "site", "clock", "tz", "sntp", "tls", "https", "webpki-roots", "web", "metrics", "ota", "mdns", "ethernet", "wifi", "bcm2837"]

[dependencies]
# API only. The single implementation comes from `rpi-hal`'s `rt` feature,
# and it has to: a program links only if its crate graph contains exactly
# one, so a library naming an implementation takes the choice away from
# every consumer.
#
# Still the only edge here, and `console` is a fair test of how long that
# lasts -- the module it backs is the one every other module logs through,
# and it needs nothing from `rpi-hal` at all. See src/console.rs for why
# its sink is a trait object rather than a `Uart`.
critical-section = { version = "1.2.0", default-features = false, optional = true }

# The HAL, for `entropy`'s hardware RNG. `default-features = false` keeps
# `rt` and `mmu` out of what this crate imposes: the boot sequence and the
# MMU bring-up are the application's to choose, and cargo unions in
# whatever it selects.
#
# Deliberately no chip feature on this line. `rpi-hal`'s PAC selection has
# a precedence order -- `bcm2711` > `bcm2837` > `bcm2835` -- so a chip
# named here would be one a consumer could not turn off, and adding a
# lower-precedence chip alongside it selects the wrong peripheral base
# silently rather than failing. In practice an application's own `rpi-hal`
# line already names one and cargo unifies it; the forwarding features
# below exist for builds of *this* crate, which have no such line.
rpi-hal = { version = "0.8.0", default-features = false, optional = true }

# The randomness interface the RustCrypto primitives under `rustls` reach
# through. `custom` is the feature that lets a target with no OS supply
# its own backend, which is what src/entropy.rs registers.
#
# 0.2 rather than 0.3: that is what the crypto stack in this crate's
# consumers resolves to, and the two majors are different mechanisms --
# 0.3 replaced `register_custom_getrandom!` with a `--cfg` and a
# `no_mangle` symbol. Moving is a change to make when the stack above
# moves, not before.
getrandom = { version = "0.2", default-features = false, features = [
    "custom",
], optional = true }

# The allocator behind `heap`. `default-features = false` with `tlsf`
# named: the crate also ships a linked-list allocator, and which one is
# in the binary should be a line someone wrote rather than a default --
# see src/heap.rs for why this one.
embedded-alloc = { version = "0.6", default-features = false, features = [
    "tlsf",
], optional = true }

# The network stack and the time API behind `net`, `mdns`, `sntp` and
# `tls`, taken *directly* rather than through `rpi-hal-embassy`.
#
# That is the answer to a question this crate deferred twice: everything
# here wants `embassy-net` and `embassy-time` for their API, and nothing
# wants the drivers behind them. `rpi-hal-embassy` supplies an
# `embassy-time` driver and an `embassy-net` adapter, both installed by
# linkage and both single-choice -- so depending on it would decide, for
# every consumer, whose time driver and whose interface they use. Taking
# the API crates leaves that with the board, which is the same
# pluggability rule the rest of this crate follows one level up.
#
# Only the floor is named on this line; each module that takes the stack
# adds the socket types it uses in [features] below -- `mdns` UDP and
# multicast, `sntp` UDP and DNS, `tls` TCP -- so a board pays for the
# sockets it has. `dhcpv4` is the application's to choose and is unioned
# in.
#
# `proto-ipv4` is what makes an IPv4 address a type at all -- smoltcp's
# address and socket enums are empty with no protocol selected, and the
# crate does not compile.
#
# `medium-ethernet` is a floor rather than a choice: smoltcp refuses to
# build a socket with no medium selected at all, and every interface a
# Pi presents to `embassy-net` -- USB Ethernet, the Wi-Fi adapter -- is
# this one. Features are additive, so a board on some other medium adds
# it alongside rather than being excluded by this.
#
# `auto-icmp-echo-reply` is what makes the interface answer a ping, and it
# is here rather than left to the application because of what its absence
# looks like: a board that takes a DHCP lease, announces itself over mDNS,
# is reachable by every other means -- and does not answer `ping`. That is
# the first thing anyone reaches for to check a board is alive, and
# without this it reports the board as dead. It cost a long debugging
# session on a board where nothing was wrong -- and then a second time,
# when a board that used `net` but none of the modules below it lost the
# reply: this line was reached only through them, so the floor was not a
# floor. `net` takes this dependency now for that reason alone.
embassy-net = { version = "0.9.1", default-features = false, features = [
    "proto-ipv4",
    "medium-ethernet",
    "auto-icmp-echo-reply",
], optional = true }
embassy-time = { version = "0.5.1", default-features = false, optional = true }
# Fixed-capacity `Vec` for building a response without the heap: `mdns`
# is useful on a board that has no `heap` feature, and a responder that
# allocated per packet would be the one module here forcing one.
#
# 0.8 rather than 0.9 to match `picoserve`, which implements its
# `Content` trait for *its* `heapless::String`. With two majors in one
# graph those are unrelated types, and the error names neither version.
heapless = { version = "0.8", default-features = false, optional = true }
# The HTTP server behind `web`. `embassy` for its `embassy-net` socket loop
# and `embassy-time` timeouts; not `json`, which is the board's to take
# for its own API routes. 0.19 is what both boards this came from run.
picoserve = { version = "0.19", default-features = false, features = [
    "embassy",
], optional = true }
# The bundle format, the install, and the timing around it, behind `ota`
# -- shared with the `rpi-loader` CLI that packs a bundle, so the two ends
# cannot disagree about the format. `apply` is the install half.
rpi-loader-ota = { version = "0.2", default-features = false, features = [
    "apply",
], optional = true }

# The settings file's format, behind `config`, read (`parse`) and written
# (`display`) by the same crate so that what one end emits the other
# accepts by construction. `std` is off because none of this has an OS.
# `toml_edit`, the format-preserving crate, is not an option on this
# target: its feature graph pulls `std` into four of its dependencies.
toml = { version = "1.1", default-features = false, features = [
    "parse",
    "display",
    "serde",
], optional = true }
# The trait a schema implements through its derive. `alloc` because a
# schema of owned strings is the ordinary case, and `DeserializeOwned` is
# what lets `config::parse` return settings that outlive the text.
# `derive` for the tables this crate writes once for every board --
# `config::NtpSettings` and `config::WifiSettings`.
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
], optional = true }
# Collects the keys a schema did not name as it deserializes, which is how
# an unknown key is reported rather than silently dropped -- serde's own
# derive can only ignore one or refuse it.
serde_ignored = { version = "0.1.14", default-features = false, optional = true }

# The filesystem behind `storage`. `mbr` is what reads a partition table,
# and a Pi's card always has one. The version has to be the one
# `rpi-hal`'s `SdBlockDevice` implements the trait for: with two in the
# graph, the adapter implements the other one's `BlockDevice` and
# `storage::mount` refuses it with an error that names neither version.
# 0.3 for `mount_first_fat`, which `storage::mount` is, and `rename`, which
# is how `config::save` replaces the file without a window where it is
# half written.
resident-fat = { version = "0.3.0", default-features = false, features = [
    "mbr",
], optional = true }
# The async mutex behind `storage::Shared`, so a task waiting for the card
# yields rather than spins. 0.7 to match what the boards' own lines name.
embassy-sync = { version = "0.7", default-features = false, optional = true }

# Local time behind `tz`: the IANA zone database's own file format, parsed
# on the board. `alloc` and not `std` -- `from_tz_data` takes a TZif file's
# bytes as a slice, and the `std` half is the part that resolves zone
# *names* against `/usr/share/zoneinfo`, which no board has. A parser
# rather than a baked table because daylight-saving rules are political
# data that change a few times a year somewhere, and the fix for one should
# be replacing 3 KB on a card rather than rebuilding a kernel.
tz-rs = { version = "0.7", default-features = false, features = [
    "alloc",
], optional = true }

# TLS behind `tls` (src/tls.rs).
#
# `default-features = false` is not optional -- the default set is `std`.
# Turning it off takes `alloc` with it, which `rustls` itself refuses
# ("Rustls currently does not support alloc-less environments"), so
# `alloc` comes back through the crypto provider below.
rustls = { version = "0.23", default-features = false, optional = true }
# The crypto provider. `ring` and `aws-lc-rs` both want a C toolchain, so
# for a bare-metal ARM target this is the one that builds at all. It is
# pre-release and unaudited: the protocol handling and chain verification
# above it are real `rustls`, the primitives here are not audited ones.
# The module documentation says so, and so should anything built on it.
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = [
    "alloc",
], optional = true }
# Mozilla's trust anchor set, compiled in, behind `webpki-roots`. Separate
# from `tls` because it is most of the size, and a board talking to one
# private server needs one anchor.
webpki-roots = { version = "1.0", default-features = false, optional = true }
# The `Read`/`Write` traits `TlsStream` is written against at both ends:
# consumed from `embassy-net`'s TCP socket, presented to whatever speaks a
# protocol over it. 0.7 because that is the major `embassy-net`
# implements, and a socket implementing 0.6 does not satisfy a 0.7 bound.
embedded-io-async = { version = "0.7", default-features = false, optional = true }

# Bare-metal only, so that `cargo test` can build this crate for the host:
# the config parser is pure, and its tests have nowhere else to run. None of
# these compile for an OS target, and none of them are needed there -- they
# are what the examples link against, and an example is only ever a Pi
# image.
[target.'cfg(target_os = "none")'.dev-dependencies]
# The examples are whole programs: they boot on `rpi-hal`'s `rt` and talk
# to real peripherals, which the library itself does not yet do. Keeping
# this to a dev edge is what stops the examples' needs -- a boot sequence,
# a particular chip -- from becoming requirements this crate imposes on
# every consumer.
#
# `rt` and `mmu` arrive as `rpi-hal`'s defaults. `bcm2837` does not (none
# of its chip features are on by default) and has to be named: the PAC is
# what `Uart::init` reaches through. Pi 2/3 because that is what the
# examples are written for; a consumer selects its own chip and is not
# affected by this line.
#
# Not `resident-fat`, although the `mdns` example mounts the card through
# `rpi_hal::sd::SdBlockDevice`: `storage` forwards that feature, so it is on
# exactly when the example's own features are. Named here it would be on
# for every example, and `resident-fat` needs an allocator -- so `hello`,
# which has none, would stop linking.
rpi-hal = { version = "0.8.0", features = ["bcm2837"] }
# How an example hands the console a sink that outlives `kmain`'s stack,
# since `console::init` borrows for `'static`. Not a library dependency:
# which static-storage crate an application uses is its own choice, and
# this crate only ever receives the reference.
static_cell = "2.1.1"
# So the entropy example can call `getrandom` the way a crypto crate
# would, which is the half of that module a direct `fill` does not
# exercise: whether the registration actually resolved. The version must
# match the optional dependency above -- cargo requires one source per
# dependency across all build targets.
#
# `custom` has to be here as well, and not only for symmetry: without it
# `getrandom` has no backend for a bare-metal target and refuses to
# compile at all, which would break the feature-free `--examples` pass
# even though nothing in it calls the crate. Enabling the feature only
# defers the choice to a registered symbol -- it does not demand one
# until something actually calls `getrandom`, which no example does
# without `entropy`.
getrandom = { version = "0.2", default-features = false, features = [
    "custom",
] }
# The Embassy platform pieces the `mdns` example needs, and the reason
# they are *here* rather than in [dependencies]: the library is written
# against `embassy-net`'s API and does not care whose time driver or
# whose interface is underneath, but an example is a whole image and has
# to pick both.
#
# `embassy-net-driver` is the USB Ethernet adapter and `wifi` the radio's;
# they are separate features there because the two share only the channel
# crate -- one is built on interrupt-driven USB transfers and the other on
# a blocking SDIO driver behind a ticker. `irq-dispatch` defines the
# `__irq_handler` that services the System Timer and USB, without which
# the first `embassy-time` deadline livelocks the core. None of the other
# examples defines one, so there is nothing for it to collide with.
rpi-hal-embassy = { version = "0.8.0", features = [
    "embassy-net-driver",
    "wifi",
    "irq-dispatch",
] }
embassy-executor = "0.10.0"
# `dhcpv4` is an application choice, which is exactly why it is on this
# side; the library's own `embassy-net` features union in with it.
embassy-net = { version = "0.9.1", default-features = false, features = [
    "dhcpv4",
] }
# For the console's clock in that example, which is the form a board on
# Embassy actually uses.
embassy-time = { version = "0.5.1", default-features = false }

# Host only, the mirror of the table above: a time driver for the `clock`
# tests, which advance a mock counter under `set` and `now`. On a Pi it
# would be a second `embassy-time` driver beside `rpi-hal-embassy`'s, and
# two is a duplicate symbol.
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
embassy-time = { version = "0.5.1", default-features = false, features = [
    "mock-driver",
] }
# The mock driver takes a `critical_section` lock, and on a Pi the
# implementation is `rpi-hal`'s; on the host it is this one.
critical-section = { version = "1.2.0", features = ["std"] }

[features]
# Nothing is on by default, and that is the crate's whole arrangement: a
# board states what it is and pays for nothing else. `default` is written
# out as empty rather than omitted so that the absence is a decision on
# the page instead of something to be inferred from a missing key.
default = []

# The console sink and `logln!` (src/console.rs).
#
# The `critical-section` edge is what the feature actually buys: the sink
# is shared between tasks and interrupt handlers, so it is behind a mutex,
# and that mutex needs an implementation in the final binary. A board that
# never logs should not have to supply one.
console = ["dep:critical-section"]

# Hardware entropy and the `getrandom` backend (src/entropy.rs).
#
# Unlike `console`, this one needs a chip: it reaches `rpi_hal::rng`,
# whose register block sits at a `PERIPHERAL_BASE` offset, and `rpi-hal`
# rejects a build with no chip feature outright. A consumer's own
# `rpi-hal` line usually supplies it; one of the three below does
# otherwise.
entropy = ["dep:rpi-hal", "dep:getrandom", "dep:critical-section"]

# The `#[global_allocator]` and its sizing (src/heap.rs).
#
# Needs a chip for the same reason `entropy` does: the extent comes from
# `rpi_hal::mem::heap_region`, which asks the firmware through the
# mailbox.
#
# Like `entropy`, enabling this decides something for the whole binary
# rather than for the caller -- a program has exactly one allocator. Off
# by default so that taking that decision is explicit.
#
# `rpi-hal/rt` is the one place this crate asks for a boot sequence rather
# than leaving it to the application, and it is not a convenience.
# `rpi_hal::mem` lives behind that feature because the region's lower
# bound is `__bss_end`, a symbol only `rt`'s linker script defines -- so
# an image that could turn `rt` off is an image with no answer to where
# free memory starts. Any board linking against `rpi-link.x` already has
# it; this makes the requirement resolve rather than surface as a missing
# module.
heap = ["dep:rpi-hal", "rpi-hal/rt", "dep:embedded-alloc"]

# Reading a settings file: TOML into the application's own schema, located
# errors, and the semantic checks TOML cannot make (src/config.rs).
#
# Implies nothing, and in particular not `console` or a storage module.
# Parsing is pure -- bytes in, settings or a located problem out -- and
# keeping it that way is what makes it testable on the host, which is
# where the tests in that file run. Reading the file off a card is a
# separate surface.
#
# Needs an allocator, which is the application's: `heap` is one, and a
# board with its own is equally served.
config = ["dep:toml", "dep:serde", "dep:serde_ignored"]

# Mounting the card's FAT volume (src/storage.rs), and with `config`,
# `config::load` to read a settings file off it.
#
# Generic over `resident-fat`'s `BlockDevice`, so it needs no chip and
# nothing from `rpi-hal`: which controller the card is on is the board's
# choice, and it hands `mount` the device.
#
# Implies `console` for the reason `mdns` does. Where the volume was found
# and what it costs in RAM are the lines that explain a board that boots
# without its settings, and the only place they can go.
#
# Needs an allocator, like `config`: `resident-fat` keeps the allocation
# table and directories on the heap.
#
# `rpi-hal?/resident-fat` turns on the HAL's `SdBlockDevice`, the adapter
# from its SD driver to the trait `mount` takes, whenever `rpi-hal` is in
# the build anyway. `?` for the reason the chip features use it: `storage`
# alone must not pull in a HAL, since the card may be behind some other
# driver entirely.
#
# `embassy-sync` for `storage::Shared`, the mutex a mounted volume sits
# behind once several tasks want it.
storage = [
    "dep:resident-fat",
    "rpi-hal?/resident-fat",
    "dep:embassy-sync",
    "console",
]

# The board's web assets: everything under `/WWW` on the card, read into
# RAM at boot and looked up by request path (src/site.rs).
#
# Only the loading and the lookup. Serving is the web module's, so a board
# can put its pages behind whatever server it has; this needs nothing
# beyond the volume `storage` mounted.
site = ["storage"]

# The wall clock: one sink every time source sets and every reader reads
# (src/clock.rs), plus the civil-date arithmetic.
#
# `embassy-time` for its `Instant` and nothing else. Which driver is
# underneath is the board's; the API crate decides none of that.
#
# No time *source* here -- `sntp` will be one, and a board with an RTC
# calls `clock::set` itself -- so turning off a source never turns this
# off. With `storage`, `mount` stamps files with this time.
clock = ["dep:embassy-time"]

# Local time: `LocalTime` and `utc_offset` over a `tz-rs` zone
# (src/clock.rs). Separate from `clock` so a board with no zone file shows
# UTC and pays for no parser.
tz = ["clock", "dep:tz-rs"]

# Setting the clock from an NTP server (src/sntp.rs): one source for
# `clock` among possible others, so a board with an RTC leaves it off and
# keeps `clock`.
#
# `embassy-net/dns` because a server is usually a name. It is on the
# `embassy-net` line for this module only, rather than for every one that
# takes the stack: a board whose only network module is `mdns` resolves
# nothing and should not carry a resolver.
#
# Implies `console` for the reason `mdns` does: a clock that never sets
# looks exactly like one nobody asked to set, and the console is the only
# place that says which.
sntp = [
    "clock",
    "dep:embassy-net",
    "embassy-net/udp",
    "embassy-net/dns",
    "console",
]

# TLS client connections over an `embassy-net` TCP socket, with real
# certificate-chain verification (src/tls.rs).
#
# Implies `clock`, which it checks certificate validity against, and
# forwards `embassy-net/tcp` for the socket. It does *not* imply `sntp`:
# what sets the clock is the board's choice, and a board with an RTC has
# no use for one.
#
# Nor `entropy`, although it needs what that provides. The crypto
# primitives reach randomness through `getrandom`, which has no backend
# on a bare-metal target -- `entropy` registers the hardware generator as
# one, and a board forgetting it gets a link error on
# `__getrandom_custom`. Implying it would pull `rpi-hal` into a module
# that otherwise reaches nothing of it, and that is what lets this one's
# configuration be tested on the host.
#
# It does enable `getrandom`'s `custom`, through the dependency above that
# already names it: without that the RustCrypto crates' own `getrandom`
# edge has no backend for this target and refuses to compile at all.
# `custom` only defers the choice to a registered symbol, which is what
# makes "forgot `entropy`" a link error naming the symbol rather than a
# compile error inside a crate three levels down.
tls = [
    "clock",
    "dep:rustls",
    "dep:rustls-rustcrypto",
    "dep:getrandom",
    "dep:embedded-io-async",
    "dep:embassy-net",
    "embassy-net/tcp",
]

# A minimal HTTPS client over `tls` (src/https.rs): one request per
# connection, chunked bodies reassembled, the body returned whatever the
# status. `embassy-net/dns` because a request names a host.
https = ["tls", "embassy-net/dns"]

# Mozilla's root set for `tls`, as `tls::client_config()`. See the
# dependency above for why it is its own feature.
webpki-roots = ["tls", "dep:webpki-roots"]

# Serving HTTP (src/web.rs): `web::serve`, the socket loop a pool of the
# board's own tasks runs, and the pieces both boards wrote identically
# around their routers -- `TextBody`, `StaticFile`, and with `site`,
# `SiteFiles`, which serves the card's `/WWW` as the router's fallback.
#
# No router and no task. The routes are the application, and a task
# cannot be generic; see the module's documentation.
#
# Needs an allocator: each task's buffers are sized by the board, at run
# time, and come off the heap once when it starts.
web = [
    "dep:picoserve",
    "dep:embassy-net",
    "embassy-net/tcp",
    "dep:embassy-time",
]

# Over-the-air updates (src/ota.rs): `ota::OtaUpload`, the route a bundle
# is posted to -- read whole, installed onto the card with the connection
# still open, answered in one JSON shape every board shares -- and
# `ota::Reboot`, the handshake to the board's reboot task once the answer
# has drained. `ota::Hooks` is what a board adds around it.
#
# Built on `web` for the route and `storage` for the card it installs
# through (`storage::Shared`); `serde` and picoserve's `json` for the
# response.
ota = [
    "web",
    "storage",
    "dep:rpi-loader-ota",
    "dep:serde",
    "picoserve/json",
]

# Writing Prometheus's text exposition format (src/metrics.rs): the
# writer, not the series. `metrics::Exposition` writes a family's
# preamble, samples with escaped labels, and fixed-point decimals without
# a float formatter; `build_info` and `uptime` are the two families every
# board publishes word for word.
#
# `embassy-time` for `uptime`'s `Instant`. Needs an allocator: the
# document is a `String`. With `web`, `Exposition::into_body` is the
# response.
metrics = ["dep:embassy-time"]

# An mDNS responder for one name (src/mdns.rs).
#
# Needs no chip and nothing from `rpi-hal`: it is written against
# `embassy-net`'s `Stack`, so which interface is underneath -- USB
# Ethernet, Wi-Fi, something this crate has never heard of -- is the
# board's business.
#
# Implies `console`, which is the first module here to do so. It reports
# what it announced and what it could not bind, and those lines are the
# only evidence a responder is working: the failure mode is a name that
# silently does not resolve. A module whose whole output is log lines
# should not be able to be built without somewhere to put them.
#
# `udp` and `multicast` are its sockets: `multicast` is what provides
# `Stack::join_multicast_group`, without which smoltcp drops a packet
# addressed to a group it has not joined before any socket sees it.
mdns = [
    "dep:embassy-net",
    "embassy-net/udp",
    "embassy-net/multicast",
    "dep:embassy-time",
    "dep:heapless",
    "console",
]

# Finding an interface and getting the board onto the network
# (src/net.rs).
#
# Needs a chip, unlike `mdns`: this one reaches the USB host controller and
# the Ethernet drivers, all of which sit at a `PERIPHERAL_BASE` offset that
# `rpi-hal` refuses to guess.
#
# Implies `console` for the same reason `mdns` does, and more so. Choosing
# an interface is a sequence of deadlines expiring, and which one expired
# is the whole diagnosis when a board comes up with no network — "no
# ethernet chip within 5000ms" and "no link within 5000ms" are different
# faults with different fixes, and neither is visible from outside.
#
# On its own it compiles the walk and no interface for it to find, which
# is a build that cannot produce a network -- so src/net.rs refuses it
# with a `compile_error!` rather than leaving a board to discover at run
# time that every entry in its order reports "not compiled in".
#
# `dep:embassy-net` although nothing in src/net.rs uses it: every
# interface this finds ends up under an `embassy-net` stack, and taking
# the crate's line is what brings its floor -- `auto-icmp-echo-reply`
# above all. Without it a board using `net` and none of the modules that
# took the stack answered no ping, which is the one check anybody makes
# first. Cargo unifies this with the application's own `embassy-net`, so
# it costs no second copy.
#
# `embassy-net/icmp` because smoltcp refuses to compile with no socket
# type at all, and with nothing else asking for one a `net`-only build of
# this crate has none. A board never notices -- its own `embassy-net` line
# brings `dhcpv4` or whatever it addresses itself with -- but naming
# `dhcpv4` here would decide that for it. The ICMP socket is the cheapest
# one and decides nothing.
net = ["dep:rpi-hal", "dep:embassy-net", "embassy-net/icmp", "console"]

# USB Ethernet as a `net` interface: a LAN9514 on a Pi 2B/3B, a LAN7800
# on a 3B+ (src/net.rs).
#
# Both chips, not one each. They are told apart by vendor and product ID
# during the bus walk and share `rpi-hal`'s `Ethernet` trait from there
# on, so a board that knows which one it has saves nothing by saying so --
# and a single image running on both is the point.
ethernet = ["net"]

# The on-board radio as a `net` interface (src/net.rs).
#
# No `rpi-hal` feature to forward: its `wifi` module is unconditional.
# What this turns on here is the `Connection::Wifi` arm of the walk and
# the `Hardware::wifi` seam the board supplies its bring-up through.
#
# Deliberately *not* implying anything that reads the firmware blobs off
# the card. Bringing a Pi's radio up means finding a firmware image, an
# nvram file and a regulatory blob somewhere, handing the EMMC controller
# from the SD driver to the SDIO one -- which gives up the card slot for
# good -- and joining with credentials from somewhere else again. Every
# one of those is the board's own decision, and this crate has no storage
# module yet to have an opinion with. See `net::Hardware::wifi`.
wifi = ["net"]

# The chip, forwarded to `rpi-hal`'s feature of the same name. None is a
# default, so a board says which it is -- and says it once, since cargo
# unifies this with whatever its own `rpi-hal` line asks for.
#
# `rpi-hal?/` rather than `rpi-hal/`: the plain form would make naming a
# chip quietly *enable* the optional dependency, so a board using nothing
# but `console` would acquire a HAL it has no use for. With `?` these say
# "if `rpi-hal` is in the build, tell it which chip", which is all they
# are for.
#
# They are not mutually exclusive as cargo features -- nothing can make
# them be -- so turning on two resolves by `rpi-hal`'s precedence rather
# than failing. That is why nothing in this repository builds with
# `--all-features`; see the Makefile.
bcm2835 = ["rpi-hal?/bcm2835"]
bcm2837 = ["rpi-hal?/bcm2837"]
bcm2711 = ["rpi-hal?/bcm2711"]

# Auto-discovery covers `hello`, which needs no features. These need
# entries so they can declare `required-features` -- without one a plain
# `cargo build --examples` would fail on an example whose module is not
# compiled.
[[example]]
name = "console"
required-features = ["console"]

# The chip is named here as well as the feature, because an example is a
# whole image and has no application manifest above it to supply one.
[[example]]
name = "entropy"
# `console` as well, because this example reports through `logln!`. Every
# example from here on will want it for the same reason, which is a fair
# sign of what a real board's feature list looks like.
required-features = ["entropy", "console", "bcm2837"]

[[example]]
name = "heap"
required-features = ["heap", "console", "bcm2837"]

# The four network examples share their bring-up through
# `examples/common/`, which is not an example itself: Cargo only
# discovers `examples/*.rs` and `examples/*/main.rs`.

# The responder over Ethernet, answering to the `hostname` in
# `kickstart.toml` -- the only example that answers to a name; the others
# are reached at the address on their `DHCP:` line. `heap`, `storage` and
# `config` for reading that one setting off the card.
[[example]]
name = "mdns"
required-features = [
    "mdns",
    "ethernet",
    "console",
    "heap",
    "storage",
    "config",
    "bcm2837",
]

# The card: the settings file read and written back, and `/WWW` loaded and
# served over HTTP, on a board reached over Ethernet at its leased address.
[[example]]
name = "site"
required-features = [
    "ethernet",
    "console",
    "heap",
    "storage",
    "config",
    "site",
    "web",
    "bcm2837",
]

# The clock from SNTP, then TLS checked against it, over Ethernet.
# `storage` and `config` for an optional `[ntp]` table; `entropy` because
# it is the `getrandom` backend `tls` needs.
[[example]]
name = "ntp_tls"
required-features = [
    "ethernet",
    "console",
    "heap",
    "storage",
    "config",
    "sntp",
    "tls",
    "webpki-roots",
    "entropy",
    "bcm2837",
]

# Both interfaces, because the point is that one image runs on a 3B, a 3B+
# and a Zero W -- the first two on Ethernet, the last on the radio, and a
# 3B on either depending on whether a cable is in. `storage` and `config`
# for the firmware blobs and the `[wifi]` credentials.
[[example]]
name = "wifi"
required-features = [
    "ethernet",
    "wifi",
    "console",
    "heap",
    "storage",
    "config",
    "bcm2837",
]

# **Temporary.** `resident-fat` 0.3 is a new major, and `rpi-hal`'s
# `SdBlockDevice`, which the examples mount through `storage::mount`, has to
# implement the same one -- the published `rpi-hal` 0.8.0 implements 0.1's.
# This builds against a local `rpi-hal` whose `resident-fat` is 0.3 until
# the release that carries it (0.9.0), and then goes, with the version
# requirements above moving to that release.
#
# `rpi-loader-ota` the same way: `ota` uses its `measure`, and `apply` on
# resident-fat 0.3, which the published 0.2.0 predates. Its next release
# (0.3.0) carries both.
[patch.crates-io]
rpi-hal = { path = "../rpi-hal" }
rpi-loader-ota = { path = "../rpi-loader/ota" }

# A fault on a bare-metal target has nowhere to unwind to -- there is no
# runtime to catch a panic and no thread to kill -- and the unwinding
# tables cost image size for a path that can never be taken. `abort` in
# both profiles so a debug build fails the same way a release one does.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
