# Kept here rather than at the repository root: a config.toml at the root
# would retarget the whole crate, and rpi-hal must keep building for the Pi.
[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
runner = "elf2uf2-rs -d"
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tlink-rp.x",
]

# No `-Tlink-rp.x` here, unlike the RP2040 above: that script places the
# second-stage bootloader, `embassy-rp` only generates it for the `rp2040`
# feature, and an RP2350 has no such stage to place. Asking for it anyway is a
# hard "cannot find linker script" at the very end of a successful build.
[target.thumbv8m.main-none-eabihf]
runner = "picotool load -u -v -x -t elf"
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
]
