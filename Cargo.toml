[package]
name = "rpi-hal"
version = "0.3.0"
edition = "2021"
description = "Hardware abstraction layer for Raspberry Pi boards using the BCM2836/BCM2837 SoC (Pi 2, Pi 3)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joeferner/rpi-hal"
documentation = "https://docs.rs/rpi-hal"
readme = "README.md"
keywords = ["raspberry-pi", "bare-metal", "embedded-hal", "bcm2837", "arm"]
categories = ["embedded", "no-std", "hardware-support"]
# Editor configuration, the CI workflows and `RELEASING.md` are the tracked
# things with no reader outside this repository -- a consumer's build never
# consults any of them, and they describe how *this* repository is checked,
# versioned and published rather than anything about using the crate.
# `RELEASING.md` is deliberately not linked from `README.md`, so leaving it
# out strands nothing.
#
# Everything else that looks like repo furniture earns its place.
# `scripts/` and `tests/hil/` are linked from `docs/getting-started.md` and
# `README.md`, so excluding them would leave a shipped link pointing at
# nothing. `tools/v3d-capture/` is how the QPU shader bytes hardcoded in
# `v3d.rs` were obtained and the only way to change what those shaders do,
# there being no assembler here -- and its capture logs stay with it because
# its own README's table cites each one as the provenance of a specific
# shader stage. None of it is worth cutting anyway: the whole package is
# 2.1MiB, 598KiB compressed.
exclude = [".vscode", ".github", "RELEASING.md"]
# The floor is `#[unsafe(naked)]`/`naked_asm!` (`fpu.rs`) plus
# `slice_as_chunks`, all stabilized in 1.88 -- 1.87 rejects each of them,
# and 1.88 builds the library with every optional feature except
# `smoltcp`, whose own manifest declares 1.91. That one is deliberately
# not folded in here: cargo reports the higher floor itself, naming
# smoltcp, and only for consumers who actually enable that feature.
#
# Nightly is not a requirement, despite `rust-toolchain.toml` pinning it
# for this repository's own builds: rustup's precompiled `core`/`alloc`
# cover both targets, so stable links a complete binary for each --
# including one using `alloc` -- and the `-Zbuild-std` in
# `.cargo/config.toml` is a convenience here rather than something
# consumers inherit.
rust-version = "1.88"

# docs.rs documents a crate with its default features unless told
# otherwise, which here is `rt` + `mmu` and no chip -- and with no chip
# selected `pac` doesn't exist, so the library doesn't compile at all and
# the published page would be a build failure instead of documentation.
# So name a chip explicitly, plus every optional feature, or the
# feature-gated modules (`async`, `multicore`, `v3d`, and the smoltcp/
# embedded-sdmmc adapters) would be missing from the docs
# rather than merely unlabelled.
#
# One build can only cover one chip: with both features on, `bcm2711`
# wins `pac`'s re-export (see `lib.rs`), so the docs would describe its
# memory map while the feature list claimed to cover both. docs.rs
# therefore shows the `bcm2837` build, and the BCM2711 differences stay
# prose (`README.md`, and this file's `bcm2837`/`bcm2711` comment).
#
# Neither target needs `-Zbuild-std`: rustup ships a precompiled `core`
# and `alloc` for both, so the plain `--target` docs.rs passes is enough,
# and the `[unstable]` section of this crate's own `.cargo/config.toml`
# (which docs.rs doesn't read) isn't a requirement for documenting it.
#
# `--cfg docsrs` is what enables the `doc_cfg` feature `lib.rs` gates
# behind that cfg, labelling each item with the feature that provides it.
[package.metadata.docs.rs]
default-target = "armv7a-none-eabi"
targets = ["aarch64-unknown-none-softfloat"]
features = [
    "bcm2837",
    "multicore",
    "async",
    "embedded-sdmmc",
    "smoltcp",
    "v3d",
]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Both PAC dependencies are optional, each gated by a feature of the same
# name as the crate (`bcm2837`/`bcm2711` -- see [features] below, neither
# on by default). `pac` (`lib.rs`) re-exports whichever one is selected;
# a consumer must pick exactly one, since nothing here has a sensible
# default target chip. `bcm2711-lpa` is generated by the same tool from
# the same SVD lineage as `bcm2837-lpa` (same `abt8601/raspi-pacs` repo),
# not an extension of it -- every peripheral this crate drives (GPIO,
# UART0, the System Timer, EMMC, the VideoCore mailbox, AUX/UART1/SPI1/
# SPI2) has an identical register layout between the two, confirmed by
# diffing the generated source, not assumed.
bcm2837-lpa = { version = "0.5.0", optional = true }
bcm2711-lpa = { version = "0.5.0", optional = true }
critical-section = { version = "1.2.0", default-features = false, features = [
    "restore-state-bool",
] }
embedded-hal = { version = "1.0.0", default-features = false }
# The async trait crates, both behind the `async` feature. Unlike the
# adapters below they don't get a feature named after each dependency:
# async support is one capability that happens to span two trait crates,
# the same split the blocking side already has (`embedded-hal` for
# digital/SPI/I2C, `embedded-io` for byte streams).
embedded-hal-async = { version = "1.0.0", default-features = false, optional = true }
embedded-io = { version = "0.7.1", default-features = false }
embedded-io-async = { version = "0.7.0", default-features = false, optional = true }
# Optional integration adapters, each behind a feature of the same name
# (see [features]). Off by default: a consumer pulls one in only if they
# want the corresponding adapter, and the underlying drivers work without
# either.
embedded-sdmmc = { version = "0.9.0", default-features = false, optional = true }
# The other FAT layer, and the newer of the two. No features selected here:
# `mbr` and `bridge` are the consumer's to choose, and the adapter this
# crate provides needs neither. Note that this one uses `alloc`, so a binary
# enabling the feature has to register a `#[global_allocator]` -- see the
# feature's comment below.
resident-fat = { version = "0.1.0", default-features = false, optional = true }
# `medium-ethernet` is what the `phy::Device` adapter needs; `proto-ipv4`
# and `socket-udp` are the minimum on top of that for smoltcp itself to
# compile at all (its address and socket enums are empty with no protocol/
# socket feature). Any higher-level features a real stack wants are
# application policy, left to the consumer -- the `usb_ethernet_smoltcp`
# example adds its DHCP/ICMP features via the dev-dependency below.
smoltcp = { version = "0.13.1", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-udp",
], optional = true }

[dev-dependencies]
# Heap allocator for the `heap_alloc` example only -- kept a dev-dependency,
# not a library dependency, because a HAL must never define a
# `#[global_allocator]` itself (only the final binary can). It locks with
# `critical-section`, which this crate already provides under `rt`.
embedded-alloc = "0.6.0"
# `mbr`, for the `sd_resident_fat_read` example's `mount_partition` -- a
# stock Pi card has a partition table, and finding the volume behind it is
# what the feature is for. Not a library feature: this crate's adapter is a
# block device and has no opinion on what is written across it. Cargo unions
# this with the optional dependency above when building the example, the
# same arrangement as `smoltcp` below.
resident-fat = { version = "0.1.0", default-features = false, features = [
    "mbr",
] }
# The DHCP/ICMP features the `usb_ethernet_smoltcp` example's stack needs,
# on top of the baseline the library's adapter pulls in. Cargo unions these
# with the optional dependency above when building the example.
smoltcp = { version = "0.13.1", default-features = false, features = [
    "proto-dhcpv4",
    "socket-dhcpv4",
    "socket-tcp",
    "socket-dns",
    "auto-icmp-echo-reply",
] }
# IR protocol decode for the `ir_nec_receive` example only. Kept a
# dev-dependency, not a library dependency: IR framing is chip-agnostic
# protocol logic on top of the GPIO/timer primitives, not a peripheral the
# HAL abstracts -- same split as `smoltcp` (TCP/IP) and `embedded-sdmmc`
# (FAT). The example uses the manual event-driven receiver (no embedded-hal
# pin, plain `u32` microsecond monotonic), so only the `nec` protocol
# feature is needed -- not the `embedded`/`fugit` integration.
infrared = { version = "0.14.2", default-features = false, features = ["nec"] }
# `sin`/`cos` for the `gpu_cube` example's rotation matrix -- kept a
# dev-dependency, not a library dependency, for the same reason as the
# others above: matrix/trig math for one example's model transform isn't
# something this HAL abstracts. `core` has no transcendental functions at
# all in `no_std`, so an example that needs one has to bring its own.
libm = "0.2.11"

[features]
default = ["rt", "mmu"]
# Provides the standard (non-relocating) `_start`. Consumers that need
# their own boot sequence (e.g. a self-relocating loader) depend on
# this crate with `default-features = false` to supply their own
# instead, avoiding a duplicate `_start` symbol.
rt = []
# Identity-mapped MMU bring-up (src/mmu.rs), called from rt's boot
# sequence -- makes core::sync::atomic actually work by giving RAM real
# Normal-memory attributes. Independent of `rt` at the Cargo level (a
# consumer supplying their own boot sequence could still opt into this
# crate's table and call it themselves), but only ever actually wired
# up automatically when `rt` is also on. `rt`'s own boot sequence calls
# `rpi_hal_mmu_init` unconditionally either way; with this feature off,
# a weak no-op fallback (see boot.rs) runs instead, unless a consumer
# provides their own strong `rpi_hal_mmu_init` -- which requires this
# feature to be off, to avoid a duplicate-symbol clash with the one
# below.
mmu = []
# Bringing up secondary cores (src/multicore.rs) and the cross-core
# spinlock that becomes necessary once a second core is actually live
# (src/critical_section.rs). Implies `mmu`: cross-core signaling relies
# on `core::sync::atomic`'s compare-exchange, which needs the
# MMU/cacheable-RAM setup `mmu` provides to behave correctly on this
# core (see mmu.rs's doc comment) -- without it, `ldrex`/`strex` are
# UNPREDICTABLE. Kept separate from `mmu` itself so a consumer who
# wants `mmu` on for other reasons doesn't pay for a spinlock they
# never need. `boot.s`'s secondary-core wait loop and its launch-request
# table are unconditional under plain `rt` regardless of this feature --
# see boot.rs -- since they're inert (cores just spin forever, same as
# today) until something actually calls `multicore::spawn`.
multicore = ["mmu"]
# Chip selection: exactly one of `bcm2837`/`bcm2711` must be enabled --
# neither is in `default`, since there's no sensible default target
# chip. Each pulls in that chip's PAC as `pac` (see the dependencies
# above and `lib.rs`'s re-export) and, for `bcm2711`, also switches
# `mmu.rs`'s `PERIPHERAL_BASE`/`LOCAL_PERIPHERAL_BASE` (and anything
# computed from them, like `dma.rs`'s `DMA_BASE` and `watchdog.rs`'s
# `PM_BASE`) to the BCM2711's relocated addresses. Compile-time, not
# runtime model detection -- the same reasoning as `mmu`/`multicore`
# above. If both are enabled at once (e.g. a consumer adds `bcm2711`
# without also disabling `bcm2837`), `bcm2711` wins `pac`'s re-export;
# `bcm2837-lpa` still gets compiled as a dependency but sits unused --
# harmless, but avoidable with `default-features = false` plus whichever
# of `rt`/`mmu` are still wanted, the same opt-out shape `rt` itself
# documents above.
#
# `bcm2711` doesn't cover peripherals that aren't just the same IP at a
# new offset (the RNG is a different block entirely on BCM2711) -- those
# need their own driver work first.
bcm2837 = ["dep:bcm2837-lpa"]
bcm2711 = ["dep:bcm2711-lpa"]
# Async trait implementations (`embedded-hal-async`, `embedded-io-async`),
# driven by the same interrupt sources the blocking drivers already
# expose. Independent of any executor: the futures are plain
# `poll`/`Waker` code, so whichever executor an application runs drives
# them. Off by default because each implementation carries a waker slot
# a purely blocking consumer shouldn't pay for.
async = ["dep:embedded-hal-async", "dep:embedded-io-async"]
# `embedded-sdmmc` `BlockDevice` adapter over the SD driver (src/sd.rs).
embedded-sdmmc = ["dep:embedded-sdmmc"]
# `resident-fat` `BlockDevice` adapter over the SD driver (src/sd.rs),
# alongside the `embedded-sdmmc` one rather than instead of it -- the two
# traits differ in their unit of transfer, and which is wanted depends on
# the filesystem above. See `sd::SdBlockDevice` for the comparison.
#
# One thing this feature carries that no other here does: `resident-fat`
# uses `alloc`, so a binary that turns it on must register a
# `#[global_allocator]` (`examples/heap_alloc.rs` shows one). This crate
# neither defines nor needs an allocator itself and still doesn't -- a HAL
# must not, since a program may have only one and that choice belongs to
# the final binary -- but the requirement travels with the dependency, and
# it surfaces as a link error rather than a helpful one.
resident-fat = ["dep:resident-fat"]
# `smoltcp` `phy::Device` adapters over the LAN9514 Ethernet driver
# (src/usb/lan9514.rs) and the Wi-Fi driver (src/wifi.rs).
smoltcp = ["dep:smoltcp"]
# VCHIQ (src/vchiq.rs): the shared-memory, doorbell-signalled message
# transport to the VideoCore firmware -- the channel every firmware-mediated
# subsystem beyond simple mailbox property queries goes through. Implies
# `mmu`: its shared region has to be remapped non-cacheable (see that
# module's doc comment), which needs this crate's translation tables to
# remap. No dependency to gate; kept as its own feature because it is a
# large subsystem, and 2MB of `.bss` for its shared region, that a consumer
# who never talks to the firmware's services shouldn't pay for.
vchiq = ["mmu"]
# MMAL (src/mmal.rs) and the hardware H.264 decoder built on it
# (src/video_decode.rs), over `vchiq`.
mmal = ["vchiq"]
# V3D 3D pipeline bring-up (src/v3d.rs) -- VideoCore IV's QPU shader
# cores and the tile-based binning/render hardware around them. No
# dependency to gate (the register block isn't in either PAC's SVD, so
# this pokes its known physical address directly like `dma.rs`/
# `rng.rs`); kept as its own feature anyway since it's a large,
# still-growing subsystem a consumer who doesn't need 3D shouldn't have
# to compile. Pi 3 (BCM2836/BCM2837) only -- the Pi 4 ships a different
# GPU generation under the same "V3D" name that this feature does not
# cover.
v3d = []

