[package]
name = "rpi-loader-firmware"
version = "0.3.0"
edition = "2021"
description = "Self-relocating UART upload loader for Raspberry Pi 2/3/4 (BCM2836/BCM2837/BCM2711) — flash once, then upload new firmware over serial instead of rewriting the SD card"
license = "MIT OR Apache-2.0"
# The floor comes from `rpi-hal`, which declares 1.88; nothing in this
# package needs anything newer. A meaningful number only since the build
# stopped requiring nightly -- `rust-toolchain.toml` pins stable now, and
# there is no `-Zbuild-std`, so rustup's precompiled `core` covers both
# bare-metal targets.
rust-version = "1.88"

# Never published. What this package produces is a raw image for a bare
# metal ARM target, built through `objcopy` and copied onto a FAT
# partition -- and `cargo install` builds for the *host* target, ignoring
# both this directory's `.cargo/config.toml` (cargo discovers config from
# the invocation's working directory, not from an installed crate) and
# the `objcopy` step entirely. A published version of this could not be
# installed by anyone; the images ship as release artifacts instead, and
# `rpi-loader` on crates.io is the host CLI that drives them.
publish = false

[dependencies]
# default-features = false disables both `rt` and `mmu`: this loader
# supplies its own boot sequence (src/boot.s) entirely, so neither
# rpi-hal's `_start` nor its `rpi_hal_mmu_init` are ever linked in --
# this crate's own boot code never references that symbol at all.
#
# `embedded-sdmmc` pulls in the crate's `SdCard` BlockDevice adapter so
# the loader can serve its `sd-list`/`sd-read`/`sd-write` commands. The
# SD/FAT path touches none of the `rt`-gated `critical-section` impl, so
# it links fine without `rt`/`mmu`.
#
# No chip feature here. rpi-hal has no chip-neutral default, so exactly
# one has to be chosen -- but choosing it on this line would make it
# unconditional, and that is only survivable for a chip rpi-hal's PAC
# selection *prefers*. It prefers `bcm2711` over `bcm2837`, which is why
# the Pi 4 build could get away with adding a second chip feature
# alongside a hardcoded `bcm2837`; it prefers `bcm2837` over `bcm2835`,
# so the Pi Zero build cannot, and would silently compile the Pi 3's
# peripheral base into a Pi Zero image. The chip is a feature of *this*
# crate instead (see [features] below), defaulting to `bcm2837` so every
# existing invocation means what it did before.
#
# 0.6.0 is a floor rather than whatever was current, and each raise has
# had a reason: 0.3.0 for the `eeprom-*` commands, which need
# `I2c::<BSC0>::init_id` and BSC0 muxed to its GPIO0/1 (HAT ID bus)
# routing; 0.6.0 for the `bcm2835` feature below, which is where that
# chip's peripheral map and ARMv6 boot code arrived.
rpi-hal = { version = "0.6.0", default-features = false, features = ["embedded-sdmmc"] }
# The FAT layer itself. This is a separate crate from rpi-hal (which only
# provides the BlockDevice adapter), so the loader depends on it directly
# for the `VolumeManager`/`Mode`/`TimeSource`/`VolumeIdx` types it drives.
embedded-sdmmc = { version = "0.9.0", default-features = false }
# rpi-hal's `I2c` implements `embedded_hal::i2c::I2c` rather than carrying
# inherent read/write methods, so the trait has to be in scope here for
# the `eeprom-*` commands to call them. Same major version rpi-hal itself
# depends on, so both halves see one set of traits.
embedded-hal = { version = "1.0.0", default-features = false }

[features]
# The chip, defaulting to the one most of these boards are. A plain
# `cargo build` therefore produces the same Pi 2/3 image it always has,
# and `--features bcm2711` the same Pi 4 one (both chip features on, and
# rpi-hal preferring `bcm2711`, exactly as before). The Pi Zero build is
# the one that has to say `--no-default-features --features bcm2835`,
# because there the preference runs the other way -- see the dependency
# comment above.
default = ["bcm2837"]
# Forwards to rpi-hal's `bcm2837` feature: the Pi 2 (BCM2836, whose
# peripherals are the BCM2837's) and the Pi 3.
bcm2837 = ["rpi-hal/bcm2837"]
# Forwards to rpi-hal's `bcm2711` feature, so this crate's own peripheral
# access (reached only through rpi-hal's PAC re-export and drivers, which
# this crate never hardcodes) moves to the BCM2711 (Pi 4) memory map and
# PAC. That is the whole of the port: the boot code (`src/boot.s`,
# `boot64.s`) needs nothing chip-specific, because it only relocates the
# image and jumps, and every peripheral it eventually touches is reached
# through rpi-hal.
#
# The GIC-400 the Pi 4 replaced the legacy interrupt controller with never
# comes up either, and neither does `Lic` on the older chips: the loader
# is polling-based throughout, built with `rt` off and no interrupts at
# all. That is why it is unaffected by `lic` being unavailable under
# `bcm2711`, where most of rpi-hal's own examples are not.
bcm2711 = ["rpi-hal/bcm2711"]
# The same arrangement for the BCM2835 (Pi 1, Pi Zero), with one
# difference that `bcm2711` does not have: this chip's port is not only a
# memory map but an instruction set. The feature moves the addresses;
# building for `armv6-none-eabi` is what selects the ARM1176's boot stub
# (`src/boot6.s`) and barriers, in this crate and in rpi-hal alike.
#
# That target is tier 3, so rustup ships no precompiled `core` for it and
# the build needs `-Z build-std` and a nightly toolchain -- the one thing
# in this package that does. It is confined to that one `make` recipe
# rather than pinned in `rust-toolchain.toml`, so the Pi 2/3/4 images
# keep building on stable exactly as before.
#
# The loader itself needs nothing else from the chip: it is polling-based,
# with no interrupt controller, no MMU and no second core to release, so
# what is missing on a BCM2835 relative to a BCM2837 is all things this
# firmware never touches.
bcm2835 = ["rpi-hal/bcm2835"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
