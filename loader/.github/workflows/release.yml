name: Release

# Publishing to crates.io is permanent -- a version can be yanked but never
# replaced or deleted -- so this never triggers on a branch push. Pushing a
# tag is the deliberate act that starts a release, and `workflow_dispatch`
# covers re-running one after a failure without moving the tag.
#
# Two independent releases share this file, told apart by their tag:
#
#   v<version>      the CLI and the loader firmware, which ship together
#   ota-v<version>  the `rpi-loader-ota` library, which does not
#
# The prefixes do not overlap -- `refs/tags/ota-v0.1.0` does not start with
# `refs/tags/v` -- so each job below runs for exactly one of them. A
# dispatch has no tag to read, so it says which package it means.
on:
  push:
    tags: ["v*", "ota-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Which package to release
        type: choice
        options: [cli, ota]
        required: true

env:
  CARGO_TERM_COLOR: always

# The release object and its uploaded images need write access to the
# repository's contents; nothing here needs anything else.
permissions:
  contents: write

jobs:
  release:
    name: publish the CLI and upload the images
    if: startsWith(github.ref, 'refs/tags/v') || inputs.package == 'cli'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7

      - name: Install the firmware's pinned toolchain
        working-directory: firmware
        run: rustup show

      # And nightly for the BCM2835 image alone: `armv6-none-eabi` is tier
      # 3, so it has no precompiled `core` and `-Z build-std` compiles one.
      # `llvm-tools` is named alongside `rust-src` because the recipe ends
      # in `cargo objcopy`, which resolves them from the sysroot of the
      # toolchain in use -- the pinned stable having them does not help
      # nightly. `--profile minimal` installs only what is listed, so
      # anything omitted here fails the image build rather than degrading
      # it.
      - name: Install nightly for the tier-3 ARMv6 target
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src \
            --component llvm-tools

      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked

      # Every guard below fails the release rather than shipping something
      # that cannot be taken back.
      - name: Both manifests agree, and the tag matches them
        id: version
        run: |
          cli="$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)"
          firmware="$(sed -n 's/^version = "\(.*\)"/\1/p' firmware/Cargo.toml | head -1)"
          if [ "$cli" != "$firmware" ]; then
            echo "cli is $cli but firmware is $firmware; the two ship as one release" >&2
            exit 1
          fi
          # A dispatch run has no tag in its context, so the manifest is
          # the authority there and there is nothing to cross-check.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$cli" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the manifest version $cli" >&2
            exit 1
          fi
          echo "version=$cli" >> "$GITHUB_OUTPUT"
          echo "tag=v$cli" >> "$GITHUB_OUTPUT"

      # The changelog must already describe this version, dated. Without
      # the date the entry claims the version was never released; without
      # the entry there is nothing to write the release notes from.
      - name: The changelog has a dated section for this version
        run: |
          version="${{ steps.version.outputs.version }}"
          if grep -q ReleaseDate CHANGELOG.md; then
            echo "CHANGELOG.md still has the ReleaseDate placeholder" >&2
            exit 1
          fi
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' section" >&2
            exit 1
          fi

      - name: The packaged tarball builds
        run: make package

      # Five images. `make` writes each build to the same handful of
      # filenames, so every one is copied out before the next overwrites
      # it.
      #
      # The loop covers the two chips that have both execution states.
      # BCM2835 sits outside it because it matches neither half of the
      # pattern: one image rather than two, the ARM1176 having no 64-bit
      # mode, and `kernel.img` rather than `kernel7.img`, because
      # `start.elf` picks the filename from the CPU it finds.
      - name: Build the images
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for chip in bcm2837 bcm2711; do
            make "build-$chip"
            cp firmware/target/kernel7.img "dist/rpi-loader-$version-$chip-kernel7.img"
            make "build64-$chip"
            cp firmware/target/kernel8.img "dist/rpi-loader-$version-$chip-kernel8.img"
          done
          make build-bcm2835
          cp firmware/target/kernel.img "dist/rpi-loader-$version-bcm2835-kernel.img"
          cd dist && sha256sum ./*.img > SHA256SUMS
          cat SHA256SUMS

      - name: Extract this version's changelog section
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="## [$version]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<'NOTE'

          ## Images

          Copy the image matching your board to the SD card's boot
          partition, renamed to the filename in its own name:
          `kernel7.img` (32-bit), `kernel8.img` (64-bit) or `kernel.img`
          (ARMv6). The firmware loads one of those names and no others,
          chosen by the CPU it finds, and a board handed the wrong one
          stops without printing anything. Use `kernel8.img` only with
          `arm_64bit=1` in `config.txt`.

          `bcm2837` covers the Pi 2 v1.2 and Pi 3; `bcm2711` covers the
          Pi 4; `bcm2835` covers the Pi 1 and Pi Zero, and is ARMv6, so it
          has no 64-bit counterpart. Verify with
          `sha256sum -c SHA256SUMS`.

          The host CLI is a separate install: `cargo install rpi-loader`.
          NOTE

      # Before the irreversible step, and idempotent, so a re-run after a
      # failed publish does not stall here.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "rpi-loader ${{ steps.version.outputs.version }}" \
              --notes-file release-notes.md
          fi

      # A re-run of an otherwise-successful release must not fail here just
      # because this half already happened; crates.io refuses a version
      # that exists, and that refusal would mask whatever the re-run was
      # for. The sparse index is the cheapest authority on the question.
      - name: Is this version already on crates.io?
        id: published
        run: |
          version="${{ steps.version.outputs.version }}"
          index="$(curl -sS https://index.crates.io/rp/i-/rpi-loader || true)"
          if printf '%s' "$index" | grep -q "\"vers\":\"$version\""; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "rpi-loader $version is already published; skipping"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the CLI to crates.io
        if: steps.published.outputs.already == 'false'
        working-directory: cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  # The library. Same guards in the same order as the job above, and
  # deliberately not factored together with it: the two release different
  # things on different schedules, and a shared job with conditionals in it
  # would be harder to read than the repetition, on the one workflow where
  # being able to read what will happen matters most.
  #
  # No images and no firmware toolchain -- this package builds for the host
  # like any other library, and `cargo package` is the only artifact.
  ota:
    name: publish rpi-loader-ota
    if: startsWith(github.ref, 'refs/tags/ota-v') || inputs.package == 'ota'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the manifest
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' ota/Cargo.toml | head -1)"
          test -n "$version" || {
            echo "ota/Cargo.toml has no version" >&2
            exit 1
          }
          # A dispatch run has no tag in its context, so the manifest is
          # the authority there and there is nothing to cross-check.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "ota-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the manifest version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=ota-v$version" >> "$GITHUB_OUTPUT"

      # Its own changelog, because its versions are its own. Dated, for the
      # same reason as the CLI's: an undated entry claims the version was
      # never released.
      - name: The changelog has a dated section for this version
        run: |
          version="${{ steps.version.outputs.version }}"
          if grep -q ReleaseDate ota/CHANGELOG.md; then
            echo "ota/CHANGELOG.md still has the ReleaseDate placeholder" >&2
            exit 1
          fi
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" ota/CHANGELOG.md; then
            echo "ota/CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' section" >&2
            exit 1
          fi

      - name: The packaged tarball builds
        run: make package-ota

      - name: Extract this version's changelog section
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="## [$version]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' ota/CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<'NOTE'

          Add it with `cargo add rpi-loader-ota`. The `rpi-loader` CLI
          builds bundles in this format; a device installs one.
          NOTE

      # Before the irreversible step, and idempotent, so a re-run after a
      # failed publish does not stall here.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" \
              --title "rpi-loader-ota ${{ steps.version.outputs.version }}" \
              --notes-file release-notes.md
          fi

      # As above: crates.io refuses a version that exists, and that refusal
      # would mask whatever a re-run was actually for.
      - name: Is this version already on crates.io?
        id: published
        run: |
          version="${{ steps.version.outputs.version }}"
          index="$(curl -sS https://index.crates.io/rp/i-/rpi-loader-ota || true)"
          if printf '%s' "$index" | grep -q "\"vers\":\"$version\""; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "rpi-loader-ota $version is already published; skipping"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.published.outputs.already == 'false'
        working-directory: ota
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
