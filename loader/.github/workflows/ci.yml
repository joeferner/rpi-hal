name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything `make pre-commit` runs locally, as separate steps rather than
  # one `pre-commit` invocation: the targets are identical either way, and
  # splitting them means a failure names itself in the job list instead of
  # having to be read out of a combined log. `fmt-check` stands in for
  # `fmt`, which would rewrite files rather than report on them.
  check:
    name: fmt, clippy, build, tests, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Two packages pin a toolchain, each for its own reasons: the firmware
      # needs both bare-metal targets and the llvm-tools behind `cargo
      # objcopy`, and the OTA package needs one bare-metal target for the
      # `no_std` half of `make clippy-ota`. rustup reads a
      # `rust-toolchain.toml` from the directory a command runs in, so
      # materialising them means running `rustup show` in each. The
      # repository root deliberately has no toolchain file.
      - name: Install the pinned toolchains
        run: |
          (cd firmware && rustup show)
          (cd ota && rustup show)
          cargo --version

      # The ARMv6 (BCM2835) recipes are the one thing here not on a pinned
      # stable toolchain: `armv6-none-eabi` is tier 3, so rustup publishes
      # no `core` for it and `-Z build-std` has to compile one, which needs
      # nightly and `rust-src`. Installed here rather than pinned in
      # `firmware/rust-toolchain.toml`, so the Pi 2/3/4 images go on
      # proving they build on stable.
      #
      # Every component is named because `--profile minimal` installs
      # exactly what is listed and nothing else, and because components are
      # per-toolchain -- what `firmware/rust-toolchain.toml` asks for on
      # stable says nothing about nightly. A workstation's default profile
      # happens to carry all three, which is how these recipes pass locally
      # and fail on a runner:
      #
      #   `rust-src`    what `-Z build-std` compiles `core` from.
      #   `llvm-tools`  behind `cargo objcopy`, which `build-bcm2835` runs
      #                 to turn the linked ELF into `kernel.img`. Resolved
      #                 from the sysroot of the toolchain in use, so the
      #                 stable one having it is no help.
      #   `clippy`      for `make clippy6`.
      - name: Install nightly for the tier-3 ARMv6 target
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src \
            --component llvm-tools \
            --component clippy

      # Unlike rpi-hal, this repository's build does not stop at `cargo
      # build`: the Makefile runs `cargo objcopy` to turn each linked ELF
      # into a raw image, and that subcommand ships in cargo-binutils
      # rather than with cargo itself.
      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked

      # `ota/tests/apply.rs` builds its FAT32 volumes with `mkfs.vfat` and
      # judges the result with `fsck.vfat`. Testing a filesystem writer
      # against another implementation of the same filesystem is the whole
      # point — a check written here could only agree with the code it is
      # checking — so these tests fail rather than skip without the tools,
      # and CI has to supply them.
      - name: Install dosfstools
        run: sudo apt-get update && sudo apt-get install -y dosfstools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            firmware
            cli
            ota

      - run: make fmt-check
      - run: make clippy
      - run: make clippy6
      - run: make clippy64
      - run: make clippy-cli
      - run: make clippy-ota
      - run: make build-bcm2837
      - run: make build64-bcm2837
      - run: make build-bcm2711
      - run: make build64-bcm2711
      - run: make build-bcm2835
      - run: make build-cli
      - run: make test-cli
      - run: make test-ota
      - run: make doc

      # Proof the release job's artifacts are actually produced, caught
      # here rather than halfway through an irreversible publish.
      - name: Both images exist
        run: test -s firmware/target/kernel7.img && test -s firmware/target/kernel8.img

  # Guards the `rust-version` claim in every manifest. Without this an MSRV
  # is a comment that rots the first time a dependency or a `core` API
  # moves. All three packages have one now that the firmware builds on
  # stable.
  #
  # Each package is checked against its own declared floor, and the
  # `+toolchain` argument overrides firmware/rust-toolchain.toml, which is
  # what makes it a test of the claim rather than of the pin.
  msrv:
    # Named from the matrix rather than left to default. GitHub otherwise
    # appends every matrix value to the job name -- including the target
    # flags, truncated mid-word -- and these names are what a branch
    # ruleset's required status checks are matched against.
    name: ${{ matrix.package }} builds on its declared MSRV
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `targets` is a plain space-separated list, read by both the
        # install and the build step below. It used to carry the `--target`
        # flags for the install while the build step named the same targets
        # again in a hardcoded loop, which meant a package added here built
        # for the firmware's targets whatever this column said.
        #
        # `features` exists because an MSRV claim covers every configuration
        # a package offers, and the OTA package's floor comes from a feature
        # that a default build does not enable.
        include:
          - package: cli
            targets: ""
            features: ""
          - package: firmware
            targets: "armv7a-none-eabi aarch64-unknown-none-softfloat"
            features: ""
          - package: ota
            targets: "armv7a-none-eabi"
            features: "--all-features"
    steps:
      - uses: actions/checkout@v7

      - name: Read the MSRV from the manifest
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' ${{ matrix.package }}/Cargo.toml)"
          test -n "$version" || {
            echo "${{ matrix.package }}/Cargo.toml has no rust-version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install that toolchain, with any targets the package needs
        run: |
          flags=""
          for target in ${{ matrix.targets }}; do
            flags="$flags --target $target"
          done
          rustup toolchain install ${{ steps.msrv.outputs.version }} \
            --profile minimal $flags

      # Build only, not test: the tests pull in dev-dependencies whose own
      # floors are their business, and it is the shipped artifact this
      # claim is about. A package with no targets listed builds for the
      # host; otherwise it builds for each of the ones it named.
      - name: Build
        working-directory: ${{ matrix.package }}
        run: |
          if [ -z "${{ matrix.targets }}" ]; then
            cargo +${{ steps.msrv.outputs.version }} build --release ${{ matrix.features }}
          else
            for target in ${{ matrix.targets }}; do
              cargo +${{ steps.msrv.outputs.version }} build --release \
                ${{ matrix.features }} --target "$target"
            done
          fi

  # `cargo package` finishes by building the packaged tarball, which catches
  # a whole class of "works here, broken on crates.io" problems: a file the
  # manifest excludes but the build needs, or a path that only resolves in
  # this working copy. Two of the three packages are publishable -- the
  # firmware sets `publish = false` -- and each is verified separately,
  # because they are released independently of one another.
  #
  # Deliberately uncached. Both recipes send their verification build to
  # its own CARGO_TARGET_DIR, and there is nothing to gain by keeping a
  # throwaway target directory for two small crates.
  package:
    name: package verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make package
      - run: make package-ota

  # Hardware-in-the-loop testing is deliberately absent: every check above
  # runs against a fake device on a pty, which pins the wire format but
  # says nothing about timing. The pacing that keeps a real PL011's RX FIFO
  # from overflowing at 1.5Mbaud is only ever proven on a board, and no
  # hosted runner has one.
